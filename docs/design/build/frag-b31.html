<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="800"><div class="dev" style="width:390px;height:800px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button><span class="ttl">無法開啟登入視窗</span></div><div class="scr" style="gap:10px"><div class="notice warn"><svg class="ic"><use href="#i-warn"/></svg><div><b>瀏覽器擋下了 Google 登入視窗</b><br>這不是你的帳號有問題，也<b>沒有讀取你的任何檔案</b>。<br><span class="small muted">錯誤代碼：popup_failed_to_open</span></div></div><div class="qcard" style="gap:4px;padding:12px 14px"><b>1　再按一次</b><span class="small" style="line-height:1.6">按下方的「再試一次」。</span></div><div class="qcard" style="gap:4px;padding:12px 14px"><b>2　還是不行：改用 Safari 或 Chrome</b><span class="small" style="line-height:1.6">請用 Safari 或 Chrome 開啟本網站。LINE 等 App 內建的瀏覽器常常擋彈出視窗。</span></div><div class="qcard" style="gap:4px;padding:12px 14px"><b>3　或允許彈出式視窗</b><span class="small" style="line-height:1.6">到瀏覽器設定，允許這個網站的彈出式視窗。待核對：各瀏覽器設定選單的實際名稱。</span></div><div class="notice"><svg class="ic"><use href="#i-info"/></svg><div><b>不想登入？</b>在試算表選「檔案」→「下載」→「Microsoft Excel (.xlsx)」，回到本程式按「選擇 Excel 檔」。這樣完全不用登入。</div></div></div><div class="actbar"><button class="btn btn-primary btn-block" type="button">再試一次</button><button class="btn btn-secondary btn-block" type="button">改用 Excel 檔</button></div></div></div><figcaption style="max-width:390px"><b>S1 Google 登入視窗被瀏覽器擋下（popup_failed_to_open）（長畫面，實機可捲動，這裡完整展開）</b>按「前往 Google」後，瀏覽器沒讓登入視窗開出來。這不是帳號的問題，沒有讀取任何檔案。文案依決定記錄〈取消帳號限制〉預防第 3 點：請再按一次；還是不行改用 Safari 或 Chrome（LINE 等 App 內建瀏覽器常擋）；或到瀏覽器設定允許這個網站的彈出式視窗；出口「改用 Excel 檔」。各瀏覽器設定選單的實際名稱待核對。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="780"><div class="dev" style="width:390px;height:780px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button><span class="ttl">登入還沒完成</span></div><div class="scr" style="gap:10px"><div class="notice warn"><svg class="ic"><use href="#i-warn"/></svg><div><b>登入視窗被關掉了</b><br>可能是你自己關掉的，也可能是 Google 在視窗裡顯示了錯誤頁後關閉。<br><span class="small muted">錯誤代碼：popup_closed</span></div></div><div class="qcard" style="gap:4px;padding:12px 14px"><b>1　想繼續：再按一次</b><span class="small" style="line-height:1.6">選好帳號後，依畫面按同意。</span></div><div class="qcard" style="gap:4px;padding:12px 14px"><b>2　Google 視窗顯示錯誤時</b><span class="small" style="line-height:1.6">常見原因是學校管理員限制了第三方應用程式。這是學校帳號的設定，本程式處理不了：換另一個 Google 帳號（例如個人帳號）再試，或改用 Excel 檔。待核對：Google 錯誤頁的實際字樣。</span></div><div class="notice"><svg class="ic"><use href="#i-info"/></svg><div><b>不想登入？</b>在試算表選「檔案」→「下載」→「Microsoft Excel (.xlsx)」，回到本程式按「選擇 Excel 檔」。這樣完全不用登入。</div></div></div><div class="actbar"><button class="btn btn-primary btn-block" type="button">再試一次</button><button class="btn btn-secondary btn-block" type="button">改用 Excel 檔</button></div></div></div><figcaption style="max-width:390px"><b>S1b Google 登入視窗被關掉（popup_closed）（長畫面，實機可捲動，這裡完整展開）</b>視窗有開出來，但沒完成登入就關了：可能是老師自己關的，也可能是 Google 在視窗裡顯示了錯誤頁後關閉（例如學校管理員限制第三方應用程式，這種情況本程式攔不到、也處理不了）。與 S1 分開說明：先請再試一次，再說明學校管理員限制時改用另一個 Google 帳號或 Excel 檔。Google 錯誤頁的實際字樣待核對。</figcaption></figure>
