--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)">2</span><div class="small" style="line-height:1.7;display:flex;flex-direction:column;gap:6px;min-width:0">按「<b>連結至試算表</b>」，在「選取回應目標位置」選「<b>建立新試算表</b>」，按「<b>建立</b>」。<span class="muted">會自動開一個新分頁顯示試算表，名稱是「表單名稱 (回覆)」。</span><div aria-hidden="true" style="border:1px solid var(--ctl);border-radius:var(--r-sm);background:var(--card);padding:8px 10px;font-size:var(--fs-xs);display:flex;flex-direction:column;gap:4px;"><b>選取回應目標位置</b><span>◉ 建立新試算表（名稱：表單名稱 (回覆)）</span><span>○ 選取現有的試算表</span><span style="text-align:right">取消　<b style="color:var(--accent-ink)">建立</b></span></div></div></div><p class="small muted" style="margin:0">更簡單：用「開啟試算表」直接讀 Google 試算表，不必匯出。</p><p class="small muted" style="margin:0">用字依 2026-11-01 在桌機 Chrome（繁體中文介面）實際操作核對（見 Google介面核對紀錄）；手機 App 與其他瀏覽器的介面<b>待核對</b>；Google 改版時可能不同。示意圖為自畫簡化版，不是 Google 截圖。</p></div><div class="actbar"><button class="btn btn-primary btn-block" type="button">下一段：匯出</button></div></div></div><figcaption style="max-width:390px"><b>G1 教學：怎麼匯出成 Excel 檔（A）（長畫面，實機可捲動，這裡完整展開）</b>A. 在 Google 表單「連結至試算表」。三步以內，名稱照實際畫面抄，「回覆」分頁與「回應」計數並用也照抄。新表單會彈出 Gemini 視窗，提醒先按右上「✕」關掉。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="960"><div class="dev" style="width:390px;height:960px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">怎麼匯出成 Excel 檔</span><button class="icbtn" type="button" aria-label="說明"><svg class="ic"><use href="#i-help"/></svg></button></div><div class="scr" style="gap:12px"><h2 style="font-size:var(--fs-lg);margin:0">B. 從回應試算表匯出 Excel 檔</h2><div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)">1</span><div class="small" style="line-height:1.7;display:flex;flex-direction:column;gap:6px;min-width:0">在試算表上方選單點「<b>檔案</b>」，再點「<b>下載</b>」。<div aria-hidden="true" style="border:1px solid var(--ctl);border-radius:var(--r-sm);background:var(--card);padding:8px 10px;font-size:var(--fs-xs);display:flex;flex-direction:column;gap:4px;"><b>檔案</b>　編輯　查看　插入…<hr style="border:0;border-top:1px solid var(--line-soft);width:100%;margin:2px 0"><span>開啟　匯入　建立副本</span><span><b>下載 ▸</b></span><span>重新命名　移動…</span></div></div></div><div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)">2</span><div class="small" style="line-height:1.7;display:flex;flex-direction:column;gap:6px;min-width:0">選「<b>Microsoft Excel (.xlsx)</b>」，檔案就會下載。<span class="muted">檔名通常是「表單名稱 (回覆).xlsx」。</span><div aria-hidden="true" style="border:1px solid var(--ctl);border-radius:var(--r-sm);background:var(--card);padding:8px 10px;font-size:var(--fs-xs);display:flex;flex-direction:column;gap:4px;"><b style="color:var(--accent-ink)">Microsoft Excel (.xlsx)</b><span>OpenDocument 檔案 (.ods)</span><span>PDF 檔案 (.pdf)</span><span>網頁 (.html)</span><span>逗號分隔值檔案 (.csv)</span><span>Tab 鍵分隔值檔案 (.tsv)</span></div></div></div><div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)">3</span><div class="small" style="line-height:1.7;display:flex;flex-direction:column;gap:6px;min-width:0">回到這裡，按「選擇 Excel 檔」選剛下載的檔案。</div></div><p class="small muted" style="margin:0">用字依 2026-11-01 在桌機 Chrome（繁體中文介面）實際操作核對（見 Google介面核對紀錄）；手機 App 與其他瀏覽器的介面<b>待核對</b>；Google 改版時可能不同。示意圖為自畫簡化版，不是 Google 截圖。</p></div><div class="actbar"><button class="btn btn-secondary" type="button">回到首頁</button><button class="btn btn-primary" type="button">選擇 Excel 檔</button></div></div></div><figcaption style="max-width:390px"><b>G2 教學：怎麼匯出成 Excel 檔（B）（長畫面，實機可捲動，這裡完整展開）</b>B. 從回應試算表匯出：「檔案」→「下載」→「Microsoft Excel (.xlsx)」。檔名通常是「表單名稱 (回覆).xlsx」；下載後回到本程式用「選擇 Excel 檔」選它。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="844"><div class="dev"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">學校帳號的表單</span><button class="icbtn" type="button" aria-label="說明"><svg class="ic"><use href="#i-help"/></svg></button></div><div class="scr" style="gap:10px"><p class="small" style="margin:0;line-height:1.7">問卷是用<b>學校帳號</b>建的，但本程式只用你的<b>私人 Gmail</b> 登入。有三種做法，擇一即可：</p><div class="qcard" style="gap:6px;padding:12px 14px"><div style="display:flex;gap:8px;align-items:center"><b style="font-size:var(--fs-md)">做法 1：共用給私人 Gmail</b><span class="tag tag-accent">建議</span></div><span class="small" style="line-height:1.6">在學校帳號的回應試算表，點「檔案」→「共用」，把你的私人 Gmail 加進去（只要能檢視就夠）。之後用私人 Gmail 登入、「開啟試算表」選它。</span></div><div class="qcard" style="gap:6px;padding:12px 14px"><div style="display:flex;gap:8px;align-items:center"><b style="font-size:var(--fs-md)">做法 2：下載 Excel 檔</b><span class="tag tag-ok">最保險</span></div><span class="small" style="line-height:1.6">不需要共用，也不用登入本程式：「檔案」→「下載」→「Microsoft Excel (.xlsx)」，再「選擇 Excel 檔」。學校限制對外共用時用這個。</span></div><div class="qcard" style="gap:6px;padding:12px 14px"><div style="display:flex;gap:8px;align-items:center"><b style="font-size:var(--fs-md)">做法 3：先共用、再建立副本</b><span class="tag">進階</span></div><span class="small" style="line-height:1.6">共用給私人 Gmail 後，用私人帳號開啟，點「檔案」→「建立副本」，副本就在私人帳號底下，之後不受學校設定影響。</span></div><div class="notice warn"><svg class="ic"><use href="#i-info"/></svg><div>共用視窗裡的欄位與按鈕名稱、學校管理員是否限制對外共用，<b>待核對</b>（需用學校帳號實際操作；已核對的只有「檔案」選單項目，見 Google介面核對紀錄）。</div></div></div><div class="actbar"><button class="btn btn-primary btn-block" type="button">看做法一的步驟</button></div></div></div><figcaption><b>S1 學校帳號的表單</b>表單與回應試算表是用學校帳號建的，本程式只用私人 Gmail 登入。說明三種做法並建議順序：①共用給私人 Gmail（檔案→共用）②下載 Excel 檔，完全不用登入 ③先共用再在私人帳號建立副本。學校若限制對外共用，改走②。共用視窗的按鈕與選項名稱尚未實際核對，標「待核對」。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="910"><div class="dev" style="width:390px;height:910px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">共用給私人 Gmail</span><button class="icbtn" type="button" aria-label="說明"><svg class="ic"><use href="#i-help"/></svg></button></div><div class="scr" style="gap:14px"><div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)">1</span><div class="small" style="line-height:1.7;display:flex;flex-direction:column;gap:6px;min-width:0">用<b>學校帳號</b>開啟回應試算表（表單「回覆」分頁→「在試算表中查看」）。</div></div><div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)">2</span><div class="small" style="line-height:1.7;display:flex;flex-direction:column;gap:6px;min-width:0">點上方選單「<b>檔案</b>」，再點「<b>共用</b>」。<div aria-hidden="true" style="border:1px solid var(--ctl);border-radius:var(--r-sm);background:var(--card);padding:8px 10px;font-size:var(--fs-xs);display:flex;flex-direction:column;gap:4px;"><b>檔案</b>　編輯　查看　插入…<span>新文件　開啟　匯入　建立副本</span><span><b>共用 ▸</b>　電子郵件　下載</span></div></div></div><div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)">3</span><div class="small" style="line-height:1.7;display:flex;flex-direction:column;gap:6px;min-width:0">在共用視窗輸入你的<b>私人 Gmail</b>，權限選「檢視者」，按傳送。<span class="muted">視窗內的欄位與按鈕名稱：<b>待核對</b>。</span></div></div><div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)">4</span><div class="small" style="line-height:1.7;display:flex;flex-direction:column;gap:6px;min-width:0">改用<b>私人 Gmail</b> 登入本程式，按「開啟試算表」，選「與我共用」的那份。<span class="muted">Google 選檔視窗的分頁名稱：<b>待核對</b>。</span></div></div><p class="small muted" style="margin:0">共用不成功（學校限制對外共用）：改用做法 2，下載 Excel 檔。</p></div><div class="actbar"><button class="btn btn-secondary" type="button">改看做法二</button><button class="btn btn-primary" type="button">完成</button></div></div></div><figcaption style="max-width:390px"><b>S2 做法一：共用給私人 Gmail（長畫面，實機可捲動，這裡完整展開）</b>步驟只寫已核對過的選單（檔案→共用）；共用視窗內的輸入框、權限選項與「傳送」按鈕名稱標「待核對」，不憑記憶。示意圖自畫簡化，不用 Google 截圖。</figcaption></figure>
