<figure class="docfig"><div class="scale" data-w="794" data-h="1123"><div class="paper doc-warm"><div class="ph"><span>三年二班 · 小組報告回饋</span><span>統計方法說明</span></div>
<div class="dt"><div class="eyebrow">附錄</div><h1 style="font-size:30px">統計方法說明</h1>
<div class="meta"><span>讓這份報告的每個數字都有出處，也能重新算出一樣的結果。</span></div></div>
<table class="dtable tight" style="font-size:13px"><tbody>
<tr><td colspan="2" style="background:var(--doc-accent-soft);font-weight:700;color:var(--doc-accent);padding:5px 8px;font-size:12.5px;letter-spacing:.06em">資料來源</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">檔案</td><td>小組報告互評_三年二班.xlsx（Google 表單匯出）</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">回覆筆數</td><td>41 筆；每位同學為 7 個小組評分（不評自己的組）</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">欄位對應</td><td>評分者＝姓名；被評對象＝組別；4 個評分項目＝量表 1–5；留言＝開放題</td></tr>
<tr><td colspan="2" style="background:var(--doc-accent-soft);font-weight:700;color:var(--doc-accent);padding:5px 8px;font-size:12.5px;letter-spacing:.06em">納入與排除</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">排除的資料</td><td>重複填答 1 筆（保留最後一筆，老師已確認）；空白留言不計入留言則數</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">去極端值</td><td>每個被評對象去除最高、最低各 1 筆評分後再平均</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">名單對照</td><td>41 位填答者皆在名單內；1 位同學未填</td></tr>
<tr><td colspan="2" style="background:var(--doc-accent-soft);font-weight:700;color:var(--doc-accent);padding:5px 8px;font-size:12.5px;letter-spacing:.06em">計算方式</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">項目平均</td><td>各評分者給分的算術平均（已去極端）</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">加權總分</td><td>(內容完整 × 30% ＋ 創意 × 25% ＋ 表達 × 25% ＋ 團隊合作 × 20%) × 20，換算為 100 分</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">自評落差</td><td>自評總分 − 他評總分；正數表示自評較高，超過 5 分標示提醒</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">標準差</td><td>母體標準差（分母為人數 n）；數字越大代表評分越分歧</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">4–5 分比例</td><td>選 4 分或 5 分的人數 ÷ 回答人數（意見調查類）</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">複選題比例</td><td>人數 ÷ 回收人數，所以加總可能超過 100%</td></tr>
<tr><td colspan="2" style="background:var(--doc-accent-soft);font-weight:700;color:var(--doc-accent);padding:5px 8px;font-size:12.5px;letter-spacing:.06em">設定與可重現性</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">評分量表標籤</td><td>1 非常不同意、2 不同意、3 普通、4 同意、5 非常同意；沒有反向計分題</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">抽籤隨機種子</td><td>20261012-3A7F（票選同票時使用）</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">留言主題分組</td><td>關鍵詞清單由老師設定，共 5 個主題；斷詞與計次在瀏覽器離線完成，不使用 AI 或外部服務</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">可重現</td><td>使用相同的檔案、欄位對應與設定，會得到完全相同的結果。設定檔可從「設定」匯出保存</td></tr>
<tr><td colspan="2" style="background:var(--doc-accent-soft);font-weight:700;color:var(--doc-accent);padding:5px 8px;font-size:12.5px;letter-spacing:.06em">提醒</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">樣本數</td><td>各組人數少時，差異可能來自隨機變動，請當作討論起點</td></tr>
<tr><td style="width:170px;font-weight:600;vertical-align:top">個資</td><td>本文件含學生資料。系統沒有上傳任何資料；請依學校個資保護規範保管與銷毀</td></tr>
</tbody></table>
<div class="pf"><span>問卷回饋小幫手 · 產生於 2026/10/30，問卷回饋小幫手 v0.2</span><span>第 1／1 頁</span></div></div></div><figcaption><b>統計方法說明頁（附錄，1 頁）</b><ul><li><b>每份輸出的最後一頁</b>，可選擇是否附上。</li><li><b>讓數字有出處</b>：資料來源、排除了什麼、怎麼算、設定值，一頁寫清楚。</li><li><b>可重現</b>：記錄抽籤種子與設定，下學期用同樣檔案與設定能得到一樣的結果。</li><li><b>誠實提醒</b>：樣本少的警語與個資保管，放在最後。</li><li><b>不使用 AI</b>：留言分組是老師設定的關鍵詞，離線計算。</li></ul></figcaption></figure>
