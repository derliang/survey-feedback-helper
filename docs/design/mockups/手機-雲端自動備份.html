<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雲端自動備份（手機）（模擬頁）</title>
<style>
:root {
  /* 色彩：表面 */
  --paper: #f4f5f7;       /* 頁面底 */
  --card: #ffffff;        /* 卡片、導覽列、輸入框底 */
  --sunk: #eceef2;        /* 凹陷底：分段控制軌道、進度軌道、停用 */
  /* 色彩：文字 */
  --ink: #14171f;
  --ink2: #444b5a;
  --ink3: #5b6373;
  /* 色彩：線 */
  --line: #cfd3dc;
  --line-soft: #e3e6ec;
  /* 色彩：強調（鈷藍，唯一的強調色；深色版用較深的藍搭白字，不用粉彩色） */
  --accent: #2554d8;
  --on-accent: #ffffff;
  --accent-soft: #e7edff;
  --accent-ink: #1b3fa6;
  /* 色彩：語意（不算強調色） */
  --ok: #17713f;
  --ok-soft: #dcf1e3;
  --warn: #7a4f00;
  --warn-soft: #fdf0d0;
  --bad: #a8262b;
  --bad-soft: #fbe2e0;
  /* 色彩：圖表資料色（色盲友善；一定要搭配文字標籤，不單靠顏色） */
  --d1: #2554d8;
  --d2: #cf5f12;
  --d3: #b3367a;
  --d4: #0c7a88;
  --d5: #8a6a0a;
  --d0: #7b8494;          /* 其他、未分類 */
  --warn-bar: #b97f00;       /* 同票、需處理的長條（對卡片 3.4:1） */
  --bar-muted: #7f889b;   /* 未當選、未突顯的長條（對卡片 3.6:1） */
  --ctl: #7f889b;         /* 控制項外框（選項卡、列按鈕）：對卡片與頁面底 3:1 以上 */
  --ext-excel: #1d6f42;   /* 外部服務代表色：僅用於自畫的 Excel「X」圖示，不是品牌色 */
  --scrim: rgba(12, 14, 20, 0.5);
  --shadow: rgba(20, 24, 40, 0.16);
  --shadow-sm: rgba(20, 24, 40, 0.08);   /* 卡片的細微層次 */

  /* 字型：介面一律系統字型，不載入網路字型 */
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
  --fs-xs: 13px;
  --fs-sm: 14px;
  --fs-md: 16px;   /* 手機輸入框不得小於 16，避免 iOS 自動放大 */
  --fs-lg: 18px;
  --fs-xl: 22px;
  --fs-2xl: 28px;
  --lh-body: 1.65;
  --lh-tight: 1.3;

  /* 間距（4 的倍數）、圓角、點擊區、動態 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --r-sm: 8px;     /* 按鈕、輸入框、選項 */
  --r-md: 12px;    /* 卡片、面板、提示 */
  --r-lg: 20px;    /* 底部彈出面板上緣 */
  --tap: 48px;     /* 手機預設點擊高度；任何可點元件不得低於 44px */
  --tap-min: 44px;
  --dur: 160ms;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1014;
    --card: #171a20;
    --sunk: #0b0c10;
    --ink: #eceef3;
    --ink2: #b9bfcc;
    --ink3: #8f97a8;
    --line: #2b303a;
    --line-soft: #20242c;
    --accent: #3d68f0;
    --on-accent: #ffffff;
    --accent-soft: #1a2850;
    --accent-ink: #9db8ff;
    --ok: #6fd39a;
    --ok-soft: #12291c;
    --warn: #f2c35c;
    --warn-soft: #2e2410;
    --bad: #ff9d96;
    --bad-soft: #3a1b1d;
    --d1: #6f93ff;
    --d2: #f08a47;
    --d3: #e579b3;
    --d4: #3fc0d0;
    --d5: #d6b43a;
    --d0: #8f97a8;
    --warn-bar: #f0b429;
    --bar-muted: #6e7789;
    --ctl: #6e7789;
    --scrim: rgba(0, 0, 0, 0.65);
    --shadow: rgba(0, 0, 0, 0.6);
    --shadow-sm: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --paper: #0e1014;
  --card: #171a20;
  --sunk: #0b0c10;
  --ink: #eceef3;
  --ink2: #b9bfcc;
  --ink3: #8f97a8;
  --line: #2b303a;
  --line-soft: #20242c;
  --accent: #3d68f0;
  --on-accent: #ffffff;
  --accent-soft: #1a2850;
  --accent-ink: #9db8ff;
  --ok: #6fd39a;
  --ok-soft: #12291c;
  --warn: #f2c35c;
  --warn-soft: #2e2410;
  --bad: #ff9d96;
  --bad-soft: #3a1b1d;
  --d1: #6f93ff;
  --d2: #f08a47;
  --d3: #e579b3;
  --d4: #3fc0d0;
  --d5: #d6b43a;
  --d0: #8f97a8;
  --warn-bar: #f0b429;
  --bar-muted: #6e7789;
  --ctl: #6e7789;
  --scrim: rgba(0, 0, 0, 0.65);
  --shadow: rgba(0, 0, 0, 0.6);
  --shadow-sm: rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

/*
 * 輸出文件主題「溫暖」（個人回饋單預設）：紙張永遠是淺色，不隨深色模式改變。
 * 用法：文件預覽與 PDF／Word 輸出的容器加 class="doc-warm"。
 */
.doc-warm {
  --doc-paper: #fffdf9;
  --doc-ink: #33291f;
  --doc-ink2: #66554a;
  --doc-line: #ead9c3;
  --doc-accent: #a84f00;
  --doc-accent-soft: #ffecd2;
  --doc-leaf: #2f6f55;
  --doc-leaf-soft: #e1f1e8;
  --doc-card: #ffffff;
  --doc-sunk: #efe8dc;
  --doc-sunk2: #f4eee4;
  --doc-blue-soft: #e3eaff;
  --doc-blue-ink: #1b3fa6;
  --doc-s1: #cf5f12;
  --doc-s2: #eaa06a;
  --doc-s3: #ddd5c8;
  --doc-s4: #7f9be3;
  --doc-s5: #2554d8;
}

/* 版面概念：上方基礎規格（色票、字級、元件），下方手機畫面並排，最後斷點示意。畫面用真實 token。 */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs-md)/var(--lh-body) var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:48px}
h1,h2,h3,h4,p{margin:0}
h1{font-size:var(--fs-2xl);line-height:var(--lh-tight);text-wrap:balance}
h2{font-size:var(--fs-xl);line-height:var(--lh-tight);text-wrap:balance}
h3{font-size:var(--fs-lg);line-height:var(--lh-tight)}
.muted{color:var(--ink2)}
.small{font-size:var(--fs-sm)}
.mono{font-family:var(--font-mono);font-size:var(--fs-xs)}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font-family:inherit}

/* 頁首 */
.top{display:flex;flex-direction:column;gap:16px}
.top-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.top-row>div{min-width:0}
.assump{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.assump p{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:14px 16px;font-size:var(--fs-sm);line-height:1.6}
.assump b{display:block;font-size:var(--fs-md);margin-bottom:4px}
.sec{display:flex;flex-direction:column;gap:20px}
.sec-head{display:flex;flex-direction:column;gap:4px;max-width:70ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.spec{box-shadow:0 1px 2px var(--shadow-sm);background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.spec h3{font-size:var(--fs-md)}
.spec .cap{font-size:var(--fs-xs);color:var(--ink3)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* 色票 */
.sws{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.sw i{display:block;height:48px;border-radius:var(--r-sm);border:1px solid var(--line)}
.sw b{font:600 var(--fs-xs)/1.3 var(--font-mono);word-break:break-all}
.sw span{font-size:var(--fs-xs);color:var(--ink2);line-height:1.4}
.sw code{font:var(--fs-xs)/1.2 var(--font-mono);color:var(--ink3)}
.scale-row{display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--line-soft);padding-block:8px;flex-wrap:wrap}
.scale-row .k{width:112px;flex:none;font-size:var(--fs-xs);color:var(--ink3)}
.sp-demo{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.sp-demo div{background:var(--accent);border-radius:2px;width:var(--w);height:24px}
.sp-demo figure{margin:0;display:flex;flex-direction:column;gap:6px;font-size:var(--fs-xs);color:var(--ink2)}


/* ===== 元件（與實作共用的 class 名稱）===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 20px;border-radius:var(--r-sm);border:1px solid transparent;font:600 var(--fs-md)/1.2 var(--font);cursor:pointer;text-decoration:none;transition:background var(--dur),border-color var(--dur)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 1px 2px var(--shadow)}
.btn:active:not([disabled]){filter:brightness(.92)}
.btn-secondary{background:var(--card);color:var(--ink);border-color:var(--ink3);box-shadow:0 1px 2px var(--shadow-sm)}
.btn-ghost{background:transparent;color:var(--accent-ink)}
.btn-danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{background:var(--sunk);color:var(--ink3);border-color:var(--line-soft);cursor:not-allowed}
.btn-sm{min-height:var(--tap-min);padding:0 16px;font-size:15px}
.btn-block{width:100%}
.icbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border:0;background:transparent;color:var(--ink);border-radius:var(--r-sm);cursor:pointer;flex:none}
.pressed{background:var(--accent-ink);color:var(--card)}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 8px;border-radius:6px;font-size:var(--fs-xs);font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag-accent{background:var(--accent-soft);color:var(--accent-ink)}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-bad{background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:var(--fs-sm)}
.field .hint{font-size:var(--fs-xs);color:var(--ink3)}
.input{min-height:var(--tap);padding:0 14px;border:1px solid var(--ink3);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:var(--fs-md)/1.2 var(--font);width:100%}
.input.err{border-color:var(--bad);border-width:2px}
.field .errmsg{font-size:var(--fs-xs);color:var(--bad);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--sunk);border-radius:var(--r-md)}
.seg button{min-height:var(--tap-min);border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink2);font:600 15px/1.2 var(--font);cursor:pointer;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--accent-ink);box-shadow:0 1px 2px var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:var(--tap-min);padding:0 16px;border-radius:999px;border:1px solid var(--ink3);background:var(--card);color:var(--ink);font:600 15px/1.2 var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.rcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;min-height:64px;padding:12px 14px;border:1.5px solid var(--ctl);border-radius:var(--r-md);background:var(--card);text-align:left;cursor:pointer;color:var(--ink);width:100%;font:inherit}
.rcard b{display:block;font-size:var(--fs-md);line-height:1.35}
.rcard small{display:block;font-size:var(--fs-sm);color:var(--ink2);line-height:1.45}
.rcard[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;flex:none;background:var(--card)}
[aria-checked="true"]>.dot,.opt[aria-checked="true"] .dot{border-color:var(--accent);background:var(--accent)}
[aria-checked="true"]>.dot::after,.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.notice{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 14px;border-radius:var(--r-md);font-size:var(--fs-sm);line-height:1.55;background:var(--accent-soft);color:var(--accent-ink)}
.notice svg.ic{width:20px;height:20px;margin-top:2px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.tile{box-shadow:0 1px 2px var(--shadow-sm);background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:10px 14px;min-width:0}
.tile .l{font-size:var(--fs-xs);color:var(--ink2)}
.tile .n{font-size:var(--fs-2xl);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile.warn{background:var(--warn-soft);border-color:transparent;box-shadow:none}
.tile.warn .l,.tile.warn .n{color:var(--warn)}
.prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.brow{display:flex;flex-direction:column;gap:6px}
.brow .h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brow .nm{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.brow .v{font-variant-numeric:tabular-nums;font-size:var(--fs-sm);color:var(--ink2);white-space:nowrap}
.brow .v b{color:var(--ink);font-size:var(--fs-md)}
.track{height:12px;border-radius:6px;background:var(--sunk)}
.track>i{display:block;height:100%;border-radius:6px;background:var(--bar-muted)}
.track>i.lead{background:var(--accent)}
.track>i.tie{background:var(--warn-bar)}
.rowbtn{box-shadow:0 1px 2px var(--shadow-sm);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:64px;padding:10px 14px;background:var(--card);border:1px solid var(--ctl);border-radius:var(--r-md);text-align:left;color:var(--ink);cursor:pointer;width:100%;font:inherit}
.rowbtn .nm{font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtn .sm{font-size:var(--fs-xs);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtn .rt{display:flex;align-items:center;gap:4px;color:var(--ink2)}
.rowbtn.need{border-color:var(--warn);border-width:1.5px}
.rowbtn>div{min-width:0}

/* ===== 手機畫面框 ===== */
.figs{display:flex;flex-wrap:wrap;gap:32px 24px;align-items:flex-start}
.fig{display:flex;flex-direction:column;gap:10px}
.fig figcaption{max-width:390px;font-size:var(--fs-sm);line-height:1.55}
.fig figcaption b{display:block;font-size:var(--fs-md)}
.scale{position:relative}
.scale>.dev{position:absolute;left:0;top:0;transform-origin:0 0}
.dev{width:390px;height:844px;border:1px solid var(--ink3);border-radius:34px;overflow:hidden;background:var(--paper);position:relative;display:flex;flex-direction:column;color:var(--ink)}
.appbar{display:flex;align-items:center;gap:4px;min-height:56px;padding:0 4px 0 8px;background:var(--card);border-bottom:1px solid var(--line-soft);flex:none}
.appbar .ttl{flex:1;font-size:17px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.brand{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--on-accent);flex:none}
.brand svg.ic{width:20px;height:20px;stroke-width:3}
.stepper{padding:10px 16px 12px;background:var(--card);border-bottom:1px solid var(--line-soft);flex:none}
.stepper .segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-xs);font-weight:600;color:var(--ink3);line-height:1.2}
.st::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.st.on{color:var(--ink2)}
.st.on::before{background:var(--accent)}
.st.cur{color:var(--accent-ink)}
.scr{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:16px}
.actbar{flex:none;padding:12px 16px 24px;background:var(--card);border-top:1px solid var(--line-soft);display:flex;gap:12px}
.actbar .btn-primary,.actbar .btn-block{flex:1}
.picker{box-shadow:0 1px 2px var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:176px;border:2px dashed var(--ink3);border-radius:var(--r-md);background:var(--card);color:var(--ink);text-align:center;padding:20px;cursor:pointer;width:100%;font:inherit}
.picker .big{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink)}
.picker .big svg.ic{width:28px;height:28px}
.picker b{font-size:var(--fs-lg)}
.picker small{font-size:var(--fs-sm);color:var(--ink2);line-height:1.5}
.filechip{box-shadow:0 1px 2px var(--shadow-sm);display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);font-size:var(--fs-sm)}
.filechip>div{min-width:0}
.filechip b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip span{color:var(--ink2);font-size:var(--fs-xs)}
.pager{display:grid;grid-template-columns:var(--tap) 1fr var(--tap);align-items:center;gap:4px}
.pager .c{text-align:center;min-width:0}
.pager .c small{display:block;font-size:var(--fs-xs);color:var(--ink2)}
.pager .c b{font-size:var(--fs-lg)}
.qcard{box-shadow:0 1px 2px var(--shadow-sm);background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:8px 14px 16px;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>.gl{font-weight:700;font-size:var(--fs-sm);color:var(--ink2)}
.sumline{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--sunk);font-size:var(--fs-sm);line-height:1.5}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:8px 16px 24px;box-shadow:0 -8px 24px var(--shadow);display:flex;flex-direction:column;gap:4px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--ink3);margin:4px auto 8px}
.sheet h3{font-size:var(--fs-lg);line-height:1.4}

<header class="pagehead"><p class="small muted">設計規範的模擬頁，使用虛構資料。規範見 docs/design/DESIGN.md 5.28。</p><h1>雲端自動備份（手機）</h1><p class="muted">雲端硬碟自動備份（2026-11-01 設計員出稿）：①登入前說明卡與開關（預設關）；②設定頁「自動存到雲端硬碟」開關、開啟前確認、關閉後行為；③存檔成功／失敗／空間滿 toast；④與資料夾存檔的先後順序。Google 介面字樣標「待核對」。</p></header>
<div class="figs">
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="1180"><div class="dev" style="width:390px;height:1180px;border-radius:34px"><div class="appbar"><span class="brand" style="margin-left:8px"><svg class="ic"><use href="#i-bars"/></svg></span><span class="ttl">問卷回饋小幫手</span><button class="icbtn" type="button" aria-label="重新開始"><svg class="ic"><use href="#i-refresh"/></svg></button><button class="icbtn" type="button" aria-label="設定"><svg class="ic"><use href="#i-gear"/></svg></button></div><div class="stepper"><div class="segs"><span class="st on cur"><span class="sl"><span class="sn">1</span>開啟問卷</span></span><span class="st"><span class="sl"><span class="sn">2</span>準備資料</span></span><span class="st"><span class="sl"><span class="sn">3</span>統計</span></span><span class="st"><span class="sl"><span class="sn">4</span>輸出</span></span></div></div><div class="scr" style="gap:12px"><div class="grp"><h1 style="font-size:var(--fs-xl)">今天要處理哪一份問卷？</h1><p class="small muted">開啟 Google 試算表，或選一個 Excel 檔。</p></div><div class="grp"><button class="btn btn-primary btn-block" type="button">開啟試算表</button><button class="btn btn-secondary btn-block" type="button">選擇 Excel 檔</button></div></div><div class="actbar"><button class="btn btn-primary" type="button" disabled>下一步：準備資料</button></div><div class="scrim"></div><div class="sheet" role="dialog" aria-label="登入前先看一下"><div class="grab"></div><h3>登入前先看一下</h3><p class="sub">個人帳號、學校帳號都能用，請選放著這份試算表、或有權限開它的那一個。</p><button class="rowbtn" type="button"><div><div class="nm">選哪個帳號？</div><div class="sm">看選帳號示意圖（自畫，不是 Google 截圖）</div></div><span class="rt"><svg class="ic"><use href="#i-next"/></svg></span></button><div class="qcard" style="padding:12px 14px;gap:8px"><b>另外：要順便備份設定檔嗎？（選填）</b><ul style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;line-height:1.6"><li class="small">存的是「問卷小幫手設定.sfh」：裡面有你的設定、範本，以及<b>匯入的學生名單</b>。問卷作答結果不會上傳。</li><li class="small"><b>只存這一個檔</b>，放在你自己的 Google 雲端硬碟。本程式只能看到自己存的這個檔，看不到你雲端硬碟裡的其他檔案。</li><li class="small">本程式沒有伺服器，<b>我們看不到這個檔</b>。</li><li class="small">如果登入的是學校帳號，學校管理員可能看得到這個檔；名單要保密時，請用個人帳號，或不要開啟。</li></ul></div><button class="tgl" role="switch" aria-checked="false" type="button"><span style="text-align:left"><b style="display:block">登入後自動存到我的雲端硬碟</b><span class="small muted">預設關閉，不打開也能照常讀試算表。</span></span><span class="sw2"></span></button><p class="small muted" style="margin:0;line-height:1.6"><b>不想登入？</b>在試算表選「檔案」→「下載」→「Microsoft Excel (.xlsx)」，回到本程式按「選擇 Excel 檔」。這樣完全不用登入，也不會備份到雲端。</p><div style="display:flex;gap:8px"><button class="btn btn-secondary btn-block" type="button">取消</button><button class="btn btn-primary btn-block" type="button">前往 Google</button></div></div></div></div><figcaption style="max-width:390px"><b>Y1 登入前先看一下（加上雲端備份說明，開關預設關）（長畫面，實機可捲動，這裡完整展開）</b>取代 S0 的內容：原有「選帳號」示意圖收成一列（點開才展開，內容不變，見 S0），騰出空間放雲端備份說明與開關。說明四句白話：存什麼（設定、範本、匯入的學生名單，不含作答結果）、只存這一個檔、我們看不到、學校帳號管理員可能看得到。<b>開關預設關</b>：不打開，登入後只讀試算表，不會寫任何東西到雲端硬碟。「不想登入？」出口保留，並補一句「也不會備份到雲端」。Google 視窗字樣沿用 S0，仍標待核對。</figcaption></figure>

己存的這個檔，看不到你雲端硬碟裡的其他檔案。</li><li class="small">本程式沒有伺服器，<b>我們看不到這個檔</b>。</li><li class="small">如果登入的是學校帳號，學校管理員可能看得到這個檔；名單要保密時，請用個人帳號，或不要開啟。</li></ul></div><button class="tgl" role="switch" aria-checked="true" type="button"><span style="text-align:left"><b style="display:block">登入後自動存到我的雲端硬碟</b><span class="small muted">登入成功後會立刻存第一次。</span></span><span class="sw2"></span></button><p class="small muted" style="margin:0;line-height:1.6"><b>不想登入？</b>在試算表選「檔案」→「下載」→「Microsoft Excel (.xlsx)」，回到本程式按「選擇 Excel 檔」。這樣完全不用登入，也不會備份到雲端。</p><div style="display:flex;gap:8px"><button class="btn btn-secondary btn-block" type="button">取消</button><button class="btn btn-primary btn-block" type="button">前往 Google</button></div></div></div></div><figcaption style="max-width:390px"><b>Y1b 同上，開關已打開（長畫面，實機可捲動，這裡完整展開）</b>老師主動打開開關後：副標改成「登入成功後會立刻存第一次」，按鈕仍是「前往 Google」。打開開關就是同意：同意只在這個畫面或 Y4（設定頁）做一次。這個偏好存在瀏覽器（介面偏好，硬規則 6 允許）；被清掉就回到預設關，是安全的方向。</figcaption></figure>

運作中）（長畫面，實機可捲動，這裡完整展開）</b>顯示：已連接 Google（<b>不顯示信箱</b>：本程式只用 drive.file 權限，拿不到也不去查信箱）、上次存到雲端的時間、檔名與位置（只在這個分頁開著期間有記憶）。按鈕：「立即存一次」「中斷 Google 連線」。第一次成功時，畫面下方出現 5 秒的成功 toast（之後每次靜默，只更新「上次存到」）。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="640"><div class="dev" style="width:390px;height:640px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">檔案與儲存</span></div><div class="scr" style="gap:14px"><div class="qcard" style="padding:12px 14px;gap:6px"><div class="qrow" style="padding:0"><svg class="ic"><use href="#i-folder"/></svg><span style="flex:1"><b>這台電腦的資料夾</b><br><span class="small muted">文件／問卷小幫手（設定與名單存在這裡）</span></span><span class="tag tag-ok">主要</span></div></div><div class="grp"><span class="gl">雲端備份（選用）</span><button class="tgl" role="switch" aria-checked="true" type="button"><span style="text-align:left"><b style="display:block">自動存到雲端硬碟</b><span class="small muted">每次更新設定，都會多存一份到你的 Google 雲端硬碟。</span></span><span class="sw2"></span></button><div class="notice warn"><svg class="ic"><use href="#i-warn"/></svg><div><b>這次還沒登入 Google，所以沒有備份。</b><br>登入資訊只放在這個分頁的記憶體，重新整理或關掉網頁就沒了；要再登入一次，才會繼續備份。<div class="acts"><button class="btn btn-primary btn-sm" type="button">登入 Google</button></div></div></div><button class="rowbtn" type="button"><div><div class="nm">存到哪裡？先後順序</div><div class="sm">資料夾、雲端、手動儲存怎麼搭配</div></div><span class="rt"><svg class="ic"><use href="#i-next"/></svg></span></button></div></div></div></div><figcaption style="max-width:390px"><b>Y3b 設定 › 檔案與儲存（開關開著，但這次還沒登入）（長畫面，實機可捲動，這裡完整展開）</b>重新整理或重開網頁後，登入資訊（只放在記憶體）會消失，但「開啟備份」的偏好還在，所以開關仍是開、卻沒有在備份。這時用警示提示明說「沒有備份」，並給「登入 Google」；不自動彈 Google 視窗（沒有使用者點擊，會被瀏覽器擋）。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="680"><div class="dev" style="width:390px;height:680px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">檔案與儲存</span></div><div class="scr" style="gap:14px"><div class="qcard" style="padding:12px 14px;gap:6px"><div class="qrow" style="padding:0"><svg class="ic"><use href="#i-folder"/></svg><span style="flex:1"><b>這台電腦的資料夾</b><br><span class="small muted">文件／問卷小幫手（設定與名單存在這裡）</span></span><span class="tag tag-ok">主要</span></div></div><div class="grp"><span class="gl">雲端備份（選用）</span><button class="tgl" role="switch" aria-checked="true" type="button"><span style="text-align:left"><b style="display:block">自動存到雲端硬碟</b><span class="small muted">每次更新設定，都會多存一份到你的 Google 雲端硬碟。</span></span><span class="sw2"></span></button><div class="notice warn"><svg class="ic"><use href="#i-warn"/></svg><div><b>雲端備份暫停中：Google 雲端硬碟空間已滿</b><br>上次成功存到：今天 14:20。清出空間後，下次有更新會自動再試；也可以現在按「立即存一次」。資料夾裡的設定檔照常更新。<div class="acts"><button class="btn btn-secondary btn-sm" type="button">立即存一次</button><button class="btn btn-ghost btn-sm" type="button">知道了</button></div></div></div><button class="rowbtn" type="button"><div><div class="nm">存到哪裡？先後順序</div><div class="sm">資料夾、雲端、手動儲存怎麼搭配</div></div><span class="rt"><svg class="ic"><use href="#i-next"/></svg></span></button></div></div></div></div><figcaption style="max-width:390px"><b>Y3c 設定 › 檔案與儲存（備份暫停：雲端硬碟空間已滿）（長畫面，實機可捲動，這裡完整展開）</b>失敗後的持續狀態：警示提示寫原因與「上次成功」時間，給「立即存一次」。資料夾照常更新。同一種失敗在同一次開啟期間只跳一次 toast，之後只更新這張提示（避免每次改設定都被打斷）；備份暫停期間，頂端「設定」鈕沿用既有的警示小點。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="1100"><div class="dev" style="width:390px;height:1100px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">檔案與儲存</span></div><div class="scr" style="gap:14px"><div class="qcard" style="padding:12px 14px;gap:6px"><div class="qrow" style="padding:0"><svg class="ic"><use href="#i-folder"/></svg><span style="flex:1"><b>這台電腦的資料夾</b><br><span class="small muted">文件／問卷小幫手（設定與名單存在這裡）</span></span><span class="tag tag-ok">主要</span></div></div><div class="grp"><span class="gl">雲端備份（選用）</span><button class="tgl" role="switch" aria-checked="false" type="button"><span style="text-align:left"><b style="display:block">自動存到雲端硬碟</b><span class="small muted">預設關閉。打開前會先說明並請你確認。</span></span><span class="sw2"></span></button><div class="small muted" style="line-height:1.6">目前沒有連接 Google，也沒有存任何東西到雲端。打開時會先登入並請你確認。</div><button class="rowbtn" type="button"><div><div class="nm">存到哪裡？先後順序</div><div class="sm">資料夾、雲端、手動儲存怎麼搭配</div></div><span class="rt"><svg class="ic"><use href="#i-next"/></svg></span></button></div></div><div class="scrim"></div><div class="sheet" role="dialog" aria-label="開啟自動存到雲端硬碟？"><div class="grab"></div><h3>開啟自動存到雲端硬碟？</h3><p class="sub">每次更新設定，都會多存一份到你自己的 Google 雲端硬碟。</p><div class="qcard" style="padding:12px 14px;gap:8px"><b>會存什麼、存到哪裡</b><ul style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;line-height:1.6"><li class="small">存的是「問卷小幫手設定.sfh」：裡面有你的設定、範本，以及<b>匯入的學生名單</b>。問卷作答結果不會上傳。</li><li class="small"><b>只存這一個檔</b>，放在你自己的 Google 雲端硬碟。本程式只能看到自己存的這個檔，看不到你雲端硬碟裡的其他檔案。</li><li class="small">本程式沒有伺服器，<b>我們看不到這個檔</b>。</li><li class="small">如果登入的是學校帳號，學校管理員可能看得到這個檔；名單要保密時，請用個人帳號，或不要開啟。</li></ul></div><div style="display:flex;gap:8px"><button class="btn btn-secondary btn-block" type="button">先不要</button><button class="btn btn-primary btn-block" type="button">開啟自動存檔</button></div></div></div></div><figcaption style="max-width:390px"><b>Y4 在設定頁打開開關：確認卡（已登入 Google 的情況）（長畫面，實機可捲動，這裡完整展開）</b>開關在「已登入」時按下去，不會直接生效，先跳這張底部面板：同樣四句說明，主按鈕「開啟自動存檔」才算同意；「先不要」開關維持關。尚未登入時改走 Y1b（先登入再存）。按下後立刻存第一次，成功就出現第一次的成功 toast。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="1000"><div class="dev" style="width:390px;height:1000px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">檔案與儲存</span></div><div class="scr" style="gap:14px"><div class="qcard" style="padding:12px 14px;gap:6px"><div class="qrow" style="padding:0"><svg class="ic"><use href="#i-folder"/></svg><span style="flex:1"><b>這台電腦的資料夾</b><br><span class="small muted">文件／問卷小幫手（設定與名單存在這裡）</span></span><span class="tag tag-ok">主要</span></div></div><div class="grp"><span class="gl">雲端備份（選用）</span><button class="tgl" role="switch" aria-checked="true" type="button"><span style="text-align:left"><b style="display:block">自動存到雲端硬碟</b><span class="small muted">每次更新設定，都會多存一份到你的 Google 雲端硬碟。</span></span><span class="sw2"></span></button><div class="qcard" style="padding:12px 14px;gap:6px"><div class="qrow" style="padding:0"><svg class="ic"><use href="#i-check"/></svg><span style="flex:1"><b>已連接 Google</b><br><span class="small muted">這個分頁開著的期間有效</span></span><span class="tag tag-ok">運作中</span></div><div class="small muted">上次存到雲端：今天 14:20 · 檔名「問卷小幫手設定.sfh」</div><div class="small muted">位置：你的雲端硬碟最上層（Google 雲端硬碟中的顯示名稱 <span class="tag">待核對</span>）</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"><button class="btn btn-secondary btn-sm" type="button">立即存一次</button><button class="btn btn-ghost btn-sm" type="button">中斷 Google 連線</button></div></div><button class="rowbtn" type="button"><div><div class="nm">存到哪裡？先後順序</div><div class="sm">資料夾、雲端、手動儲存怎麼搭配</div></div><span class="rt"><svg class="ic"><use href="#i-next"/></svg></span></button></div></div><div class="scrim"></div><div class="sheet" role="dialog" aria-label="關閉自動存到雲端硬碟？"><div class="grab"></div><h3>關閉自動存到雲端硬碟？</h3><p class="sub">關閉後：</p><ul style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;line-height:1.6"><li>不會再把新的更新存到雲端。</li><li>雲端硬碟裡<b>已經存的那份會留著</b>，本程式不會刪它。要刪，請到 Google 雲端硬碟自己刪（「移到垃圾桶」的實際字樣 <span class="tag">待核對</span>）。</li><li>你資料夾裡的設定檔照常更新，不受影響。</li></ul><label class="qcard" style="padding:12px 14px;gap:4px;flex-direction:row;align-items:flex-start;cursor:pointer"><input type="checkbox" aria-label="同時中斷 Google 連線" style="margin-top:4px;width:20px;height:20px;flex:none"><span style="flex:1"><b>同時中斷 Google 連線</b><br><span class="small muted">之後再讀 Google 試算表，需要重新登入。</span></span></label><div style="display:flex;gap:8px"><button class="btn btn-secondary btn-block" type="button">保持開啟</button><button class="btn btn-primary btn-block" type="button">關閉自動存檔</button></div></div></div></div><figcaption style="max-width:390px"><b>Y5 關閉開關：說明關閉後的行為（長畫面，實機可捲動，這裡完整展開）</b>關閉要先確認，因為老師最怕的是「關了以為資料被刪、或以為已經沒在存」。三句寫清楚：①不再存新的更新；②雲端硬碟裡已存的那份<b>會留著，程式不會刪</b>，要刪請自己到 Google 雲端硬碟刪；③資料夾裡的設定檔不受影響。選項「同時中斷 Google 連線」預設不勾（之後讀試算表要再登入）。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="1180"><div class="dev" style="width:390px;height:1180px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">toast 樣式與文案</span></div><div class="scr" style="gap:10px"><div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;flex-direction:column;gap:6px"><span class="small muted" style="font-weight:700">① 第一次成功（5 秒後自動消失）</span><div class="toast2" role="status"><span class="tm">已把「問卷小幫手設定.sfh」存到你的 Google 雲端硬碟。之後有更新會自動再存。</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><span class="small muted" style="font-weight:700">② 網路不通</span><div class="toast2 fail" role="alert"><span class="ti"><svg class="ic"><use href="#i-warn"/></svg></span><span class="tm">沒能存到 Google 雲端硬碟：連不上 Google。設定檔仍在你的資料夾，下次有更新會再試一次。</span><button class="ta" type="button">重試</button><button class="tx" type="button" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button></div></div><div style="display:flex;flex-direction:column;gap:6px"><span class="small muted" style="font-weight:700">③ 登入過期（401）</span><div class="toast2 fail" role="alert"><span class="ti"><svg class="ic"><use href="#i-warn"/></svg></span><span class="tm">Google 登入過期了，雲端備份先暫停。</span><button class="ta" type="button">重新登入</button><button class="tx" type="button" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button></div></div><div style="display:flex;flex-direction:column;gap:6px"><span class="small muted" style="font-weight:700">④ 用量上限（Google 暫時限流，429）</span><div class="toast2 fail" role="alert"><span class="ti"><svg class="ic"><use href="#i-warn"/></svg></span><span class="tm">Google 暫時限制了存取次數，這次沒存到。過一兩分鐘，下次有更新會再試一次。</span><button class="tx" type="button" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button></div></div><div style="display:flex;flex-direction:column;gap:6px"><span class="small muted" style="font-weight:700">⑤ 雲端硬碟空間用完</span><div class="toast2 fail" role="alert"><span class="ti"><svg class="ic"><use href="#i-warn"/></svg></span><span class="tm">你的 Google 雲端硬碟空間已滿，沒能備份。清出空間後會自動再試；資料夾裡的設定檔不受影響。</span><button class="tx" type="button" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button></div></div><div style="display:flex;flex-direction:column;gap:6px"><span class="small muted" style="font-weight:700">⑥ 其他／原因不明</span><div class="toast2 fail" role="alert"><span class="ti"><svg class="ic"><use href="#i-warn"/></svg></span><span class="tm">沒能存到 Google 雲端硬碟，原因不明。設定檔仍在你的資料夾；到「設定」按「立即存一次」可以再試。</span><button class="tx" type="button" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button></div></div><p class="small muted" style="margin:0;line-height:1.6">（沒選資料夾的裝置，句尾改為：這台裝置沒有資料夾，請先按「儲存到檔案」另存一份。）</p></div></div></div></div><figcaption style="max-width:390px"><b>Y6 toast 文案與樣式（同一時間只出現一則，這裡並排看）（長畫面，實機可捲動，這裡完整展開）</b>成功：沿用既有深底 toast，5 秒自動消失。失敗：同底色加警示圖示、role="alert"、<b>不自動消失</b>（要按 ✕），可有一個動作鈕（重試／重新登入）。動作鈕與 ✕ 都 ≥44 高。位置沿用既有：手機在底部操作列上方，桌機離底 24px。⑤ 與 ④ 要分開寫：空間滿要老師去清空間，限流只要等；現有 src/google/quota.ts 的 quota 一類兩者混用，且 failureMessage 的文字講的是「讀取」「改用 Excel 檔」，存檔時不適用，需另寫存檔版（見 DESIGN.md 5.28）。</figcaption></figure>
<figure class="fig" style="margin:0"><div class="scale" data-w="390" data-h="1180"><div class="dev" style="width:390px;height:1180px;border-radius:34px"><div class="appbar"><button class="icbtn" type="button" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button><span class="ttl">存到哪裡？</span></div><div class="scr" style="gap:14px"><ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;line-height:1.6"><li><b>資料夾（主要）</b>：桌機 Chrome／Edge 選的資料夾。每次更新都先寫這裡，它是你的「正本」。</li><li><b>Google 雲端硬碟（備份，選用）</b>：資料夾寫完後，再多存一份；同一個檔名，直接覆蓋上一次的。</li><li><b>儲存到檔案（手動）</b>：手機、平板、Safari 沒有資料夾時，隨時可以自己存。</li></ol><div style="border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden;background:var(--card)"><div style="padding:10px 14px;display:flex;flex-direction:column;gap:2px"><b class="small">有資料夾，也開了雲端</b><span class="small muted" style="line-height:1.6">先存資料夾，再存雲端。雲端失敗不影響資料夾，只會提醒。</span></div><div style="padding:10px 14px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px"><b class="small">沒有資料夾（手機、平板、Safari），開了雲端</b><span class="small muted" style="line-height:1.6">雲端是唯一的自動備份。建議偶爾再按「儲存到檔案」另存一份。</span></div><div style="padding:10px 14px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px"><b class="small">有資料夾，沒開雲端</b><span class="small muted" style="line-height:1.6">跟以前一樣，只存資料夾。</span></div><div style="padding:10px 14px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px"><b class="small">都沒有</b><span class="small muted" style="line-height:1.6">頂端「設定」鈕會有小點，提醒設定還沒保存。</span></div></div><div class="notice"><svg class="ic"><use href="#i-info"/></svg><div><b>只往雲端寫，不會讀回來蓋掉本機。</b>要從雲端還原：首頁按「開啟設定檔」，在系統選檔視窗選雲端硬碟裡的那個檔（選檔視窗的名稱<span class="tag">待核對</span>）。</div></div><div class="notice warn"><svg class="ic"><use href="#i-warn"/></svg><div><b>兩台電腦用同一個 Google 帳號都開著備份時，後存的會蓋掉先存的</b>（同名覆蓋），不會自動合併。換電腦前，請先在舊電腦存好、再開新電腦。</div></div></div></div></div><figcaption style="max-width:390px"><b>Y8 存到哪裡？先後順序（長畫面，實機可捲動，這裡完整展開）</b>從設定頁「存到哪裡？先後順序」進入。三層：資料夾（主要）→ 雲端（選用備份）→ 手動儲存到檔案；下方四種情境各一句話；再提醒兩件事：只往雲端寫、不讀回來；兩台電腦同帳號會互相覆蓋。</figcaption></figure>
